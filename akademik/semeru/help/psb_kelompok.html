<p class="help-title">Kelompok Calon Siswa</p>

<p class="help-content">Sebelum melakukan pendataan calon siswa, pengguna harus membuat "Kelompok Calon Siswa" dahulu, misalnya: "Gelombang I", "Gelombang II" dan lainnya</p>

<p class="help-content">Setiap Proses Penerimaan Siswa Baru bisa memiliki lebih dari satu Kelompok Calon Siswa</p>
